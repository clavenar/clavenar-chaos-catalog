[package]
name = "clavenar-chaos-catalog"
version = "0.1.0"
edition = "2024"
authors = ["Vanteguard Labs <vanteguardlabs@gmail.com>"]
description = "Pure-data attack catalog for Clavenar's red-team and demo flows. Lifted from clavenar-chaos-monkey so clavenar-chaos-monkey, clavenar-console (/demo/fire), and any future caller can fire the same scenarios from one canonical source."
license = "Apache-2.0"
repository = "https://github.com/clavenar/clavenar-chaos-catalog"
readme = "README.md"
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
# Wire shape: every attack payload is an MCP-style JSON RPC body.
serde_json = "1"
# Wall-clock-stamped identity-token builders. Built fresh per fire so a long
# catalog run doesn't ship a stale claim.
chrono = "0.4"
# Base64 for adversarial JWT-style identity-token values. No JWT crypto here —
# the catalog ships invalid tokens on purpose; the proxy / identity-service
# rejection is the verdict the attacks test.
base64 = "0.22"

[lints.rust]
unreachable_pub = "warn"
